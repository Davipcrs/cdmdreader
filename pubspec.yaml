name: cdmdreader
description: "A easy markdown reader for linux and windows."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  file_picker: ^12.1.3
  flutter_markdown_plus: ^1.0.12
  mini_utils: ^0.0.6-r3
  flutter_riverpod: ^3.4.3
  window_manager: ^0.5.1
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
